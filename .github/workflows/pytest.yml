# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Pytesting

on:
  pull_request:
    branches: [ main ]
    paths:
      - backend/**
  # push:
  #   branches: [ main ]
  #   paths:
  #     - backend/**

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --all-extras --dev
        
      - name: Lint changed Python files with Ruff
        shell: bash
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.py' | sed 's#^backend/##')
          if [ -n "$files" ]; then
            uv run ruff check --select E,F,SIM --ignore E501,F403 $files
          fi

      - name: Report Pyright baseline
        continue-on-error: true
        run: uv run pyright

      - name: Run tests
        # For example, using `pytest`
        run: uv run pytest --cov=./ --cov-report=term
