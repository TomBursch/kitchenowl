name: Create Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to release from"
        required: true
        default: "main"
        type: string
      release_kind:
        description: "Release kind"
        required: true
        default: "bugfix"
        type: choice
        options:
          - bugfix
          - feature
          - major
      release_channel:
        description: "Release channel"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ inputs.branch }}-${{ inputs.release_channel }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Bump version, tag, and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Fail if release token is missing
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo "Missing RELEASE_TOKEN secret" >&2
            exit 1
          fi

      - name: Parse and bump version
        id: version
        shell: bash
        run: |
          raw_version="$(sed -n 's/^version:[[:space:]]*//p' kitchenowl/pubspec.yaml | head -n1)"
          raw_version="${raw_version%$'\r'}"

          version_name_part="${raw_version%%+*}"
          build_part="${raw_version#*+}"

          if [[ -z "$version_name_part" || "$build_part" == "$raw_version" ]]; then
            echo "Unsupported pubspec version format: $raw_version" >&2
            exit 1
          fi

          IFS='.' read -r major minor patch <<< "$version_name_part"
          build="$build_part"

          for part_name in major minor patch build; do
            part_value="${!part_name}"
            if [[ -z "$part_value" || ! "$part_value" =~ ^[0-9]+$ ]]; then
              echo "Unsupported pubspec version format: $raw_version" >&2
              exit 1
            fi
          done

          case "${{ inputs.release_kind }}" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            feature)
              minor=$((minor + 1))
              patch=0
              ;;
            bugfix)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unsupported release kind: ${{ inputs.release_kind }}" >&2
              exit 1
              ;;
          esac

          build=$((build + 1))
          version_name="${major}.${minor}.${patch}"
          pubspec_version="${version_name}+${build}"

          if [[ "${{ inputs.release_channel }}" == "beta" ]]; then
            tag_name="beta-v${version_name}"
            prerelease="true"
          else
            tag_name="v${version_name}"
            prerelease="false"
          fi

          if git rev-parse -q --verify "refs/tags/${tag_name}" >/dev/null; then
            echo "Tag already exists: ${tag_name}" >&2
            exit 1
          fi

          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "pubspec_version=${pubspec_version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

      - name: Update pubspec.yaml
        shell: bash
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.pubspec_version }}/" kitchenowl/pubspec.yaml

      - name: Commit and push version bump
        id: version_bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kitchenowl/pubspec.yaml
          git commit -m "chore: bump version to ${{ steps.version.outputs.version_name }}"
          git push origin "HEAD:${{ inputs.branch }}"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Determine changelog range
        id: changelog_range
        shell: bash
        run: |
          if [[ "${{ inputs.release_channel }}" == "beta" ]]; then
            previous_tag="$(git for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags/v* refs/tags/beta-v* | head -n1)"
          else
            previous_tag="$(git for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags/v* | head -n1)"
          fi

          if [[ -n "$previous_tag" ]]; then
            echo "has_previous_tag=true" >> "$GITHUB_OUTPUT"
            echo "from_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          else
            echo "has_previous_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build changelog from previous tag
        if: steps.changelog_range.outputs.has_previous_tag == 'true'
        id: generated_changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: "changelog_configuration.json"
          fromTag: ${{ steps.changelog_range.outputs.from_tag }}
          toTag: ${{ steps.version_bump.outputs.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build initial release notes
        if: steps.changelog_range.outputs.has_previous_tag != 'true'
        id: generated_initial_notes
        shell: bash
        run: |
          {
            echo "changelog<<EOF"
            echo "## Initial Release"
            echo
            git log --reverse --pretty=format:'- %s (%h)' HEAD
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        shell: bash
        run: |
          git tag "${{ steps.version.outputs.tag_name }}"
          git push origin "${{ steps.version.outputs.tag_name }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          target_commitish: ${{ inputs.branch }}
          name: KitchenOwl ${{ steps.version.outputs.tag_name }}
          body: ${{ steps.generated_changelog.outputs.changelog || steps.generated_initial_notes.outputs.changelog }}
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          token: ${{ secrets.RELEASE_TOKEN }}
