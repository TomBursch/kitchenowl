name: Release Android APK

on:
  push:
    tags:
      - "v*"
      - "beta-v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional app version override for manual runs, for example 0.7.9 or 0.7.9-beta"
        required: false

permissions:
  contents: write

jobs:
  build-and-release-android:
    name: Build and publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: kitchenowl

      - name: Resolve Android app version
        id: android_version
        shell: bash
        run: |
          release_version='${{ github.event.inputs.release_version || '' }}'

          if [[ -z "$release_version" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" == beta-v* ]]; then
              release_version="${GITHUB_REF_NAME#beta-v}-beta"
            elif [[ "$GITHUB_REF_NAME" == v* ]]; then
              release_version="${GITHUB_REF_NAME#v}"
            else
              echo "Unsupported tag format: $GITHUB_REF_NAME" >&2
              exit 1
            fi
          fi

          if [[ -z "$release_version" ]]; then
            release_version="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*$/\1/p' kitchenowl/pubspec.yaml)"
          fi

          build_number="$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))"

          echo "build_name=$release_version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Configure Android signing keystore
        run: |
          echo "$PLAY_STORE_UPLOAD_KEY" | base64 --decode > app/upload-keystore.jks
          echo "storeFile=upload-keystore.jks" >> key.properties
          echo "keyAlias=$KEYSTORE_KEY_ALIAS" >> key.properties
          echo "storePassword=$KEYSTORE_STORE_PASSWORD" >> key.properties
          echo "keyPassword=$KEYSTORE_KEY_PASSWORD" >> key.properties
        env:
          PLAY_STORE_UPLOAD_KEY: ${{ secrets.PLAY_STORE_UPLOAD_KEY }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
        working-directory: kitchenowl/android

      - name: Build release APK
        run: flutter build apk --release --build-name "${{ steps.android_version.outputs.build_name }}" --build-number "${{ steps.android_version.outputs.build_number }}"
        working-directory: kitchenowl

      - name: Prepare release asset
        run: |
          cp kitchenowl/build/app/outputs/flutter-apk/app-release.apk \
            kitchenowl-android-${GITHUB_REF_NAME}.apk

      - name: Publish GitHub release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: KitchenOwl ${{ github.ref_name }}
          draft: false
          prerelease: ${{ startsWith(github.ref_name, 'beta-v') }}
          files: kitchenowl-android-${{ github.ref_name }}.apk
