[uwsgi]
strict = true
master = true
enable-threads = true
http-websockets = true
lazy-apps=true
vacuum = true
single-interpreter = true
die-on-term = true
need-app = true
chmod-socket = 664

wsgi-file = wsgi.py
callable = app
socket = [::]:5000
procname-prefix-spaced = kitchenowl

[celery]
ini = :uwsgi
smart-attach-daemon = /tmp/celery.pid celery -A app.celery_app worker -B --pidfile=/tmp/celery.pid

[web]
ini = :uwsgi
http = [::]:8080
http-keepalive = 1
http-to = :5000
static-map = /=/var/www/web/kitchenowl
route = ^\/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|manifest\.json|version\.json)$ addheader:Cache-Control: no-cache
route = ^(?!\/(?:flutter_bootstrap|flutter_service_worker)\.js$)(?:\/assets\/|.*\.(?:js|mjs|wasm|symbols)$) addheader:Cache-Control: public, max-age=31536000, immutable
route = ^\/(?!api)(?!mcp)[^\.]*$ addheader:Cache-Control: no-cache
route = ^\/(?!api)(?!mcp)[^\.]*$ static:/var/www/web/kitchenowl/index.html
